[project]
name = "rlive-example"
version = "0.1.0"
description = "Example utilities and demonstration scripts for the ReLoop_RLive project"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch>=2.0",
    "d3rlpy>=2.8.0",
    "rlive-common",
    "rlive-env[all]",
    "rlive-sim[all]",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
rlive-common = { workspace = true }
rlive-env = { workspace = true }
rlive-sim = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

