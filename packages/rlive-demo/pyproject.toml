[project]
name = "rlive-demo"
version = "0.1.0"
description = "Demo utilities and examples for the ReLoop_RLive project"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "rlive-common",
    "rlive-env",
    "rlive-sim",
]

[tool.uv.sources]
rlive-common = { workspace = true }
rlive-env = { workspace = true }
rlive-sim = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

