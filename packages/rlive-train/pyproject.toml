[project]
name = "rlive-train"
version = "0.1.0"
description = "Training skripts and utilities for the ReLoop_RLive project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "d3rlpy>=2.8.0",
    "stable-baselines3>=2.3.0",
    "rlive-common",
    "rlive-env",
    "rlive-sim[all]",
    "tensorboard>=2.20.0",
    "tqdm>=4.67.3",
    "wandb>=0.26.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
rlive-common = { workspace = true }
rlive-env = { workspace = true }
rlive-sim = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"
