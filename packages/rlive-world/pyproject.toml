[project]
name = "rlive_world"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.120.2",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "pydantic>=2.12.3",
    "rlive-common",
]

[tool.uv.sources]
rlive-common = { workspace = true }

[project.scripts]
rlive-world = "rlive_world.main_function:main" # "main:main"

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"
