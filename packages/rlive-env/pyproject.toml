[project]
name = "rlive-env"
version = "0.1.0"
description = "Client-side Gymnasium-compatible environment for remote robot control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "python-dotenv>=1.2.1",
    "rlive-common",
]

[tool.uv.sources]
rlive-common = { workspace = true }

[project.scripts]
rlive-env = "rlive_env.cli:main"

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"
