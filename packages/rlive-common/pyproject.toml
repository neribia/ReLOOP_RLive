[project]
name = "rlive-common"
version = "0.1.0"
description = "Core functionality for ReLoop RLive"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "pydantic>=2.12.3",
]

[project.optional-dependencies]
all = [
    "gymnasium>=1.2.1",
]
gym = ["gymnasium>=1.2.1"]

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"
