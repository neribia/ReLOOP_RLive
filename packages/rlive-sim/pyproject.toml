[project]
name = "rlive-sim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=2.2.6",
    "gymnasium>=1.2.1",
    "rlive-common",
]

[tool.uv.sources]
rlive-common = { workspace = true }

[project.scripts]
rlive-env = "rlive_env.cli:main"

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"
