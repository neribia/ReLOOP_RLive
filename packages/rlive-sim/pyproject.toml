[project]
name = "rlive-sim"
version = "0.1.0"
description = "Flexible simulation package for reinforcement learning with pluggable physics and rendering backends"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "rlive-common",
    "numpy>=2.2.6",
    "gymnasium>=1.2.1",
    "opencv-python>=4.12.0.88",
]

[project.optional-dependencies]
mujoco = ["mujoco>=3.5.0"]

[tool.uv.sources]
rlive-common = { workspace = true }

[project.scripts]
rlive-sim = "rlive_sim.cli:main"

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"
