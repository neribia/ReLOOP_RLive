[project]
name = "reloop_rlive_dev"
version = "0.1.0"
description = "Demonstrator for the ReLoop project — a reinforcement learning environment for controlling physical robots"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = []

[tool.uv]
# sphero-unsw declares <3.11 but works fine on 3.11 (pure Python BLE wrapper)
override-dependencies = ["sphero-unsw>=0.1.8"]

[tool.uv.workspace]
members = [
    "packages/rlive-common",
    "packages/rlive-world",
    "packages/rlive-env",
    "packages/rlive-sim",
    "packages/rlive-example",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.3",
]
mkdocs = [
    "mike>=2.1.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.22",
    "mkdocstrings-python>=1.18.2",
]

[tool.ruff]

lint.select = [
  'E',   # pycodestyle
  'F',   # pyflakes
  'UP',  # pyupgrade
  'D',   # pydocstyle
  'PL',  # pylint
]
line-length = 120

[tool.ruff.lint.pydocstyle]
convention = 'google'


